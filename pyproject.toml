[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-agentguard"
version = "0.1.0"
description = "Executable evidence contracts, access logging, and verification for clinical EHR agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md", "DATA_LICENSE_NOTICE.md"]
dependencies = ["requests>=2.31", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "duckdb>=1.1"]
analysis = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "statsmodels>=0.14", "matplotlib>=3.8"]
ingest = ["duckdb>=1.1", "pyarrow>=15", "openpyxl>=3.1"]
retrieval = ["rank-bm25>=0.2.2", "sentence-transformers>=3"]
local-model = ["torch>=2.4", "transformers>=4.46", "accelerate>=1"]

[project.urls]
Repository = "https://github.com/Yangxinyee/EHR-AgentGuard"

[tool.setuptools.packages.find]
include = ["scopebench*", "scripts*"]

[tool.setuptools.package-data]
scopebench = ["SKILL_SPEC.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
